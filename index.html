<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>The Odin Project | Sign Up Form</title>
    <script src="script.js" defer></script>
</head>
<body>
    <section class="left img-box">
        <div class="left logo-box">
            <img src="images/odin-lined.png" class="logo">
            <div class="left logo-text">ODIN</div>
        </div>
        <div class="left credits-line">Photo by <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on <a href="https://unsplash.com/">Unsplash</a></div>
    </section>

    <section class="right-container">
        <header class="right header">
            <p class="right title">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>
            <p class="right subtitle">You <em>know</em> you want to.</p>
        </header>

        <div class="right form-container">
            <form action="#" method="post">
                <div class="box-with-shadow">
                    <div class="input-container">
                        <h2 class="right form-title">Let's do this!</h2>
                        <div class="input-boxes">
                            <div class="input-box first-name">
                                <label for="first-name">first name</label>
                                <input type="text" id="first-name" name="first-name"/>
                            </div>

                            <div class="input-box last-name">
                                <label for="last-name">last name</label>
                                <input type="text" id="last-name" name="last-name"/>
                            </div>

                            <div class="input-box email">
                                <label for="email">email</label>
                                <input type="email" id="email" name="email"/>
                            </div>

                            <div class="input-box phone-number">
                                <label for="phone-number">phone number</label>
                                <input type="tel" id="phone-number" name="phone-number"/>
                            </div>

                            <div class="input-box password">
                                <label for="pwd">password</label>
                                <input type="password" id="pwd" name="password" required/>
                            </div>

                            <div class="input-box password confirm">
                                <label for="pwd">confirm password</label>
                                <input type="password" id="pwd" name="password"required/>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="submit">Create Account</button>
            </form>

            <div class="right login">Already have an account? <a href="#">Log in</a></div>
        </div>
    </section>

</body>
</html>
